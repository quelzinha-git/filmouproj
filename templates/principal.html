<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Página Principal</title>
    <link rel="stylesheet" href="../static/css/principal.css">
</head>
<body>

<div class="topo">
    <h1>Bem vindo(a)!</h1>
</div>

<div class="botoes">

    <div class="botao">
        <a href="/usuario/avaliacoes">Avaliar</a>
    </div>

    <div class="botao">
        <button type="button" onclick="abrirModal()">Pesquisar</button>
    </div>

    <div class="botao">
        <a href="/usuario/lista">Minha lista</a>
    </div>

    <div class="botao">
        <a href="/usuario/sair">Sair</a>
    </div>

</div>

<dialog id="meuModal">
    <h2>Pesquisar Filme</h2>

    <form action="/usuario/pesquisar" method="GET">
        <input type="text" name="nome_filme" placeholder="Digite o nome do filme">
        <br><br>
        <button type="submit">Buscar</button>
        <button type="button" onclick="fecharModal()">Cancelar</button>
    </form>
</dialog>

<script src="../static/js/modal.js"></script>

</body>
</html>
