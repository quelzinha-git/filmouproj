<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Avaliações</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/avaliacoes.css') }}">
</head>
<body>

    <div class="container">

        <h1>Avaliar um Filme 🎬</h1>

        <form action="/usuario/avaliacoes" method="POST">

            <label for="filme">Nome do filme:</label><br>
            <input type="text" id="filme" name="filme" required>
            <br><br>

            <label for="nota">Nota:</label><br>
            <input type="number" id="nota" name="nota" min="0" max="10" required>
            <br><br>

            <button type="submit">Enviar avaliação</button>

        </form>

        <br>

        <a href="/usuario/principal">Voltar</a>

        {% if msg %}
            <h3>{{ msg }}</h3>
        {% endif %}

    </div>

</body>
</html>
